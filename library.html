</option>

</select>

<option value="all">
كل الأنواع
</option>

<option value="كتاب">
كتب
</option>

<option value="دوسية">
دوسيات
</option>

امتحانات
</option>

<script src="script.js"></script>


<script>

let allFiles = [];


async function loadLibrary() {

const response =
await fetch("content.json");

const data =
await response.json();

allFiles =
data.files || [];

populateSubjects();

renderFiles(allFiles);

}


function populateSubjects() {

const select =
document.getElementById(
"subjectFilter"
);

const subjects =
[
...new Set(
allFiles.map(
file => file.subject
)
)
].filter(Boolean);


subjects.forEach(subject => {

const option =
document.createElement("option");

option.value = subject;

option.textContent = subject;

select.appendChild(option);

});

}


function filterFiles() {

const query =
document.getElementById(
"searchInput"
).value
.toLowerCase()
.trim();

const branch =
document.getElementById(
"branchFilter"
).value;

const subject =
document.getElementById(
"subjectFilter"
).value;

const type =
document.getElementById(
"typeFilter"
).value;


const result =
allFiles.filter(file => {

const text =
`${file.title} ${file.teacher || ""} ${file.subject || ""}`
.toLowerCase();


const searchMatch =
text.includes(query);


const branchMatch =
branch === "all" ||
file.branch === branch ||
file.branch === "مشترك";


let typeMatch = true;

if (type === "كتاب") {

typeMatch =
file.type.includes("كتاب") ||
file.type.includes("حلول");

}

if (type === "دوسية") {

typeMatch =
file.type.includes("دوسية") ||
file.type.includes("ملخص");

}

if (type === "امتحان") {

typeMatch =
file.type.includes("امتحان") ||
file.type.includes("وزاري") ||
file.type.includes("تجريبي");

}

if (type === "تأسيس") {

typeMatch =
file.type.includes("تأسيس");

}


return (
searchMatch &&
branchMatch &&
(subject === "all" ||
file.subject === subject) &&
typeMatch
);

});


renderFiles(result);

}


function renderFiles(files) {

const container =
document.getElementById(
"filesContainer"
);

container.innerHTML = "";


if (!files.length) {

container.innerHTML = `
<div class="empty">
<i class="fa-solid fa-box-open"></i>
<p>ما لقينا ملفات مطابقة للبحث.</p>
</div>
`;

return;

}


files.forEach(file => {

const card =
document.createElement("article");

card.className =
"file-card";


card.innerHTML = `

<div class="badges">

<span class="badge">
${file.branch || ""}
</span>

<span class="badge">
${file.subject || ""}
</span>

<span class="badge">
${file.type || ""}
</span>

</div>


<h3>
${file.title}
</h3>


<p>
${file.teacher
? "الأستاذ: " + file.teacher
: "ملف تعليمي"}
</p>


<a
class="file-btn"
href="${file.url}"
target="_blank"
rel="noopener">

<i class="fa-solid fa-arrow-up-right-from-square"></i>

فتح الملف

</a>

`;


container.appendChild(card);

});

}


document
.getElementById("searchInput")
.addEventListener(
"input",
filterFiles
);


document
.getElementById("branchFilter")
.addEventListener(
"change",
filterFiles
);


document
.getElementById("subjectFilter")
.addEventListener(
"change",
filterFiles
);


document
.getElementById("typeFilter")
.addEventListener(
"change",
filterFiles
);


loadLibrary();

</script>


</body>
